services:
  - type: web
    name: geoai
    runtime: python
    plan: free
    branch: master
    repo: https://github.com/CEO-LEO/GEOai.git
    # ⚠️ Render's actual live build command is set in the Dashboard
    # (Settings → Build & Deploy), NOT synced from this file for this
    # service — confirmed 2026-08-17 when this line was changed to
    # "backend/requirements.txt" and the build still ran the dashboard's
    # stale "pip install -r requirements.txt", failing because the root
    # requirements.txt had been deleted. Keep this file's root
    # requirements.txt in sync with backend/requirements.txt until the
    # dashboard setting is manually updated to match.
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_API_KEY
        value: VQBL_7QERqR4Vgrybadjg3J3OdF1StV9K3SGWslfY6U
        scope: build,run
      - key: SPHERE_KEY
        value: 58319FD529C64DDEB319F94C4B395BC7
        scope: build,run
      # ⚠️ Add these in Render Dashboard → Environment (do NOT commit secrets):
      # GEE_SERVICE_ACCOUNT, GEE_KEY_JSON, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
      # LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET, LIFF_URL
    healthCheckPath: /health
