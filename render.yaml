services:
  - type: web
    name: geoai
    runtime: python
    plan: starter  # อัพเกรดจาก free เป็น always-on แล้ว (2026-08-23) — เหมือนกับ
    # buildCommand ด้านล่าง ค่านี้อาจไม่ synced กับที่ตั้งจริงใน Dashboard เช่นกัน
    # (Settings → Instance Type) แก้ตรงนี้ไว้เพื่อให้เอกสารตรงกับความจริงเท่านั้น
    branch: master
    repo: https://github.com/CEO-LEO/GEOai.git
    # ⚠️ Render's actual live build command is set in the Dashboard
    # (Settings → Build & Deploy), NOT synced from this file for this
    # service — confirmed 2026-08-17 when this line was changed to
    # "backend/requirements.txt" and the build still ran the dashboard's
    # stale "pip install -r requirements.txt", failing because the root
    # requirements.txt had been deleted. Keep this file's root
    # requirements.txt in sync with backend/requirements.txt until the
    # dashboard setting is manually updated to match.
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    # ห้ามใส่ค่า secret ในไฟล์นี้ — repo เป็น public (เคยมี ADMIN_API_KEY/SPHERE_KEY ตัวจริง
    # อยู่ตรงนี้ เอาออกเมื่อ 2026-10-15 — ค่าชุดนั้นยังอยู่ใน git history ถือว่ารั่วแล้ว ห้ามใช้อีก) ตั้งค่าทั้งหมดใน
    # Render Dashboard → Environment; `sync: false` = Render ไม่เขียนทับค่าที่ตั้งไว้ใน Dashboard
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: SPHERE_KEY
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_KEY_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LIFF_URL
        sync: false
      # ไม่บังคับ: LINE_LOGIN_CHANNEL_ID (ถ้าไม่ตั้ง ใช้ส่วนหน้าของ LIFF ID — ดู backend/auth.py)
    healthCheckPath: /health
