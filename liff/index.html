<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GEOai - ตรวจสวนทุเรียน อ.นายายอาม</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *  { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root{
      --green:#15803d; --green2:#16a34a; --green-dk:#14532d;
      --line-green:#06C755; --blue:#1565c0; --amber:#e65100; --red:#c62828;
      --ink:#1f2a24; --muted:#6b7d72; --soft:#9aa8a0;
      --bg:#eef3ee; --card:#ffffff; --line:#e6ece7;
      --r:16px; --shadow:0 2px 10px rgba(20,60,35,.06), 0 1px 3px rgba(20,60,35,.05);
    }
    body { font-family: 'Sarabun', sans-serif; color: var(--ink);
           background:
             radial-gradient(900px 400px at 100% -5%, rgba(22,163,74,.10), transparent 60%),
             var(--bg);
           display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
           -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    #header {
      background: linear-gradient(135deg, var(--green2), var(--green-dk));
      color: white; padding: 14px 18px 15px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; box-shadow: 0 4px 18px rgba(20,83,45,.28);
      position: relative; z-index: 5;
    }
    #header h1 { font-size: 16px; font-weight: 700; letter-spacing:.2px; line-height:1.3; }
    #header small { font-size: 12px; opacity: .85; display:block; margin-top:2px; }

    /* ── Tabs (segmented pill) ── */
    #tabs {
      display: flex; gap: 6px; padding: 10px 12px;
      background: transparent; flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 11px 8px; text-align: center;
      font-size: 14px; font-weight: 700; color: var(--muted);
      cursor: pointer; border-radius: 12px; background: var(--card);
      border: 1px solid var(--line); transition: all .18s;
      box-shadow: var(--shadow);
    }
    .tab:active { transform: scale(.97); }
    .tab.active {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--green2), var(--green));
      box-shadow: 0 4px 14px rgba(21,128,61,.32);
    }

    /* ── Panels ── */
    .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .panel.active { display: flex; }

    /* ── My Plots panel ── */
    #plot-list-wrap { flex: 1; overflow-y: auto; padding: 6px 12px 18px; }
    .plot-card {
      background: var(--card); border-radius: var(--r);
      padding: 14px 15px; margin-bottom: 11px;
      display: flex; align-items: center; gap: 13px;
      box-shadow: var(--shadow); border: 1px solid var(--line);
      cursor: pointer; transition: transform .15s;
      position: relative; overflow: hidden;
    }
    .plot-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
      background: linear-gradient(180deg, var(--green2), var(--green)); }
    .plot-card:active { transform: scale(.985); }
    .plot-icon { font-size: 30px; flex-shrink: 0; width:46px; height:46px; display:grid; place-items:center;
      background:#eaf7ee; border-radius:13px; }
    .plot-info { flex: 1; min-width:0; }
    .plot-name { font-weight: 700; font-size: 15px; color: var(--ink); }
    .plot-coords { font-size: 11.5px; color: var(--soft); margin-top: 3px; }
    .plot-area { font-size: 11.5px; color: var(--green); font-weight:600; margin-top: 2px; }
    .plot-check-btn {
      background: var(--line-green); color: white; border: none;
      padding: 9px 15px; border-radius: 11px; font-size: 13.5px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 10px rgba(6,199,85,.3); transition: transform .12s;
    }
    .plot-check-btn:active{ transform: scale(.94); }
    .plot-hist-btn {
      background: #eaf7ee; color: var(--green); border: none;
      padding: 8px 11px; border-radius: 11px; font-size: 12.5px; font-weight:600;
      cursor: pointer; white-space: nowrap;
    }
    .plot-ts-btn {
      background: #e8f0fb; color: var(--blue); border: none;
      padding: 8px 11px; border-radius: 11px; font-size: 12.5px; font-weight:600;
      cursor: pointer; white-space: nowrap;
    }
    .plot-del-btn {
      background: transparent; color: #b91c1c; border: 1px solid #f0dcdc;
      padding: 7px 11px; border-radius: 11px; font-size: 12px;
      cursor: pointer; white-space: nowrap;
    }
    .plot-btn-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    #no-plots {
      text-align: center; padding: 56px 24px; color: var(--muted);
      display: none; font-size: 14px; line-height: 1.7;
    }
    #no-plots .emoji { font-size: 54px; display: block; margin-bottom: 14px; }

    /* ── New plot panel ── */
    #map { flex: 1; min-height: 0; }
    .leaflet-container{ font-family:'Sarabun',sans-serif; }

    #new-plot-panel {
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); background: var(--card);
      box-shadow: 0 -4px 20px rgba(20,60,35,.10);
      flex-shrink: 0; border-radius: 18px 18px 0 0; position:relative; z-index:3;
    }
    #coords-display {
      font-size: 12.5px; color: #2f4a3a; padding: 10px 12px;
      background: #eef9f1; border-radius: 11px;
      border-left: 4px solid var(--green2); margin-bottom: 11px;
      min-height: 38px; line-height:1.5;
    }
    .input-row { display: flex; gap: 8px; margin-bottom: 9px; }
    .input-row input {
      flex: 1; padding: 11px 12px; border: 1.5px solid var(--line);
      border-radius: 11px; font-size: 14px; font-family: inherit; color:var(--ink);
      background:#fafdfb; transition:border-color .15s;
    }
    .input-row input:focus { outline: none; border-color: var(--green2); background:#fff; }
    .btn-row { display: flex; gap: 8px; }
    button.btn-secondary {
      background: #eef3ee; color: #33473b; border: none;
      padding: 13px 10px; border-radius: 12px; font-size: 13.5px;
      font-weight: 700; cursor: pointer; flex: 1; transition: transform .12s;
    }
    button.btn-secondary:active{ transform: scale(.96); }
    button.btn-primary {
      background: linear-gradient(135deg, #07d95e, var(--line-green)); color: white; border: none;
      padding: 13px 10px; border-radius: 12px; font-size: 14px;
      font-weight: 700; cursor: pointer; flex: 1.5; transition: transform .12s;
      box-shadow: 0 4px 14px rgba(6,199,85,.34);
    }
    button.btn-primary:active{ transform: scale(.97); }
    button:disabled { opacity: .42; cursor: default; box-shadow:none; }
    button.btn-draw {
      background: var(--blue); color: white; border: none;
      padding: 13px 10px; border-radius: 12px; font-size: 13.5px;
      font-weight: 700; cursor: pointer; flex: 1; transition: transform .12s;
    }
    button.btn-draw:active{ transform: scale(.96); }
    button.btn-draw.drawing { background: #c62828; box-shadow:0 3px 12px rgba(198,40,40,.35); }
    button.btn-grid {
      background: #0288d1; color: white; border: none;
      padding: 12px 10px; border-radius: 12px; font-size: 13.5px;
      font-weight: 700; cursor: pointer; flex: 1; transition: transform .12s;
    }
    button.btn-grid:active{ transform: scale(.96); }
    #grid-legend {
      display: none; flex-wrap: wrap; gap: 6px 12px;
      margin-top: 10px; padding: 9px 11px; background: #f3f8fb;
      border-radius: 10px; font-size: 11.5px; color: #33473b;
    }
    #grid-legend.show { display: flex; }
    #grid-legend .legend-item { display: flex; align-items: center; gap: 4px; }
    #grid-legend .legend-item i {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
      box-shadow: 0 0 0 1px rgba(0,0,0,.1);
    }

    #detail-modal {
    display: none; position: fixed; inset: 0; z-index: 9990;
    background: rgba(15,30,20,.5); align-items: flex-end;
    justify-content: center; backdrop-filter: blur(2px);
  }
  #detail-modal.show { display: flex; }
  #detail-box {
    background: var(--bg); width: 100%; max-height: 90dvh;
    border-radius: 22px 22px 0 0; padding: 8px 15px calc(18px + env(safe-area-inset-bottom));
    overflow-y: auto; box-shadow: 0 -8px 40px rgba(0,0,0,.25);
    animation: sheetUp .28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes sheetUp { from{ transform: translateY(40px); opacity:.4 } to{ transform:none; opacity:1 } }
  #detail-box::before{ content:""; display:block; width:42px; height:5px; border-radius:3px;
    background:#cdd8d0; margin:6px auto 14px; }
  #detail-box h3 { font-size: 16px; color: var(--green-dk); margin-bottom: 14px; font-weight:700; }
  .sparkline-wrap {
    background: var(--card); border-radius: 14px; padding: 12px 14px;
    margin-bottom: 12px; box-shadow: var(--shadow); border:1px solid var(--line);
  }
  .sparkline-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight:600; }
  .sparkline-svg { width: 100%; height: 60px; display: block; }
  .hist-row {
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding: 12px 13px; font-size: 13px; color: var(--ink); margin-bottom:9px;
    box-shadow: var(--shadow);
  }
  .hist-row .hist-date { font-size: 11.5px; color: var(--soft); margin-bottom: 5px; }
  .hist-row .hist-badge {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: bold; color: white; margin-right: 6px;
  }
  .hist-red { background: #e53935; }
  .hist-orange { background: #fb8c00; }
  .hist-green { background: #16a34a; }
  .close-modal-btn {
    width: 100%; background: var(--card); color: #33473b; border: 1px solid var(--line);
    padding: 14px; border-radius: 13px; font-size: 14.5px;
    font-weight: 700; cursor: pointer; margin-top: 14px; box-shadow: var(--shadow);
  }
  .close-modal-btn:active{ transform: scale(.98); }

    /* ── Result Card (farmer-friendly analysis display) ── */
    .result-header {
      text-align: center; padding: 18px 14px 16px; margin-bottom: 14px;
      background: linear-gradient(135deg, #f0fdf4, #eafaef);
      border-radius: 16px; border:1px solid var(--line); box-shadow: var(--shadow);
    }
    .result-header .result-icon { font-size: 44px; display: block; margin-bottom: 6px; }
    .result-header .result-status {
      font-size: 18px; font-weight: 800; letter-spacing:.2px;
    }
    .result-header .result-coords {
      font-size: 11.5px; color: var(--soft); margin-top: 6px;
    }
    .result-section {
      background: var(--card); border-radius: 15px; padding: 14px 15px;
      margin-bottom: 11px; box-shadow: var(--shadow); border:1px solid var(--line);
    }
    .result-section.warn { background: #fffaf0; border-color:#fbe6c4; }
    .result-section.danger { background: #fff5f5; border-color:#f6dada; }
    .result-section-title {
      font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 10px;
      display: flex; align-items: center; gap: 7px;
      padding-bottom:8px; border-bottom:1px solid var(--line);
    }
    .result-section.warn .result-section-title { color: var(--amber); border-color:#fbe6c4; }
    .result-section.danger .result-section-title { color: var(--red); border-color:#f6dada; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13.5px; padding: 6px 0; color: #3c4a42; gap:10px;
    }
    .result-row .label { color: var(--muted); flex-shrink:0; }
    .result-row .value { font-weight: 700; color: var(--ink); text-align:right; }
    .result-advice {
      font-size: 13px; color: #44524a; line-height: 1.65;
      margin-top: 8px; padding: 10px 12px;
      background: #f5faf6; border-radius: 11px;
      border-left: 4px solid var(--green2);
    }
    .result-section.warn .result-advice { border-left-color: #fb8c00; background:#fff8ec; }
    .result-section.danger .result-advice { border-left-color: #e53935; background:#fdf0f0; }
    .result-meter {
      height: 10px; border-radius: 6px; background: #e8eee9;
      margin: 8px 0 2px; overflow: hidden;
    }
    .result-meter-fill {
      height: 100%; border-radius: 6px;
      transition: width .6s cubic-bezier(.22,1,.36,1);
    }
    .result-impact-item {
      padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,.06);
      font-size: 13px; color: #44524a; line-height:1.55;
    }
    .result-impact-item:last-child { border-bottom: none; }
    .result-impact-item .imp-title { font-weight: 700; color: var(--ink); margin-bottom: 3px; }

    /* ── Sphere Marker pin (mock mode SVG) ── */
    .sphere-marker-pin { background: none !important; border: none !important; }
    .sphere-marker-html { background: none !important; border: none !important; }

    /* ── SWAB — Soil Water-Air Balance visualisation ── */
    .swab-gauge-wrap { margin: 10px 0 4px; }
    .swab-gauge {
      position: relative; height: 14px; border-radius: 7px;
      background: linear-gradient(to right,
        #1565c0 0%, #42a5f5 30%, #43a047 50%, #fb8c00 70%, #e53935 100%);
    }
    .swab-optimal {
      position: absolute; top: -2px; height: 18px;
      left: 42.5%; width: 15%;   /* index −15% to +15% → center zone */
      border: 2px solid #43a047; border-radius: 5px;
      background: rgba(67,160,71,0.15);
    }
    .swab-needle {
      position: absolute; top: -4px;
      width: 4px; height: 22px;
      background: white; border: 2px solid #333;
      border-radius: 2px; transform: translateX(-2px);
    }
    .swab-gauge-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #888; margin-top: 3px;
    }
    .swab-pore-bar {
      display: flex; height: 10px;
      border-radius: 5px; overflow: hidden;
      margin: 8px 0 2px;
    }
    .swab-pore-water { background: #1565c0; }
    .swab-pore-air   { background: #b3e5fc; }
    .swab-pore-solid { background: #a1887f; }
    .swab-pore-labels {
      display: flex; gap: 10px;
      font-size: 10px; color: #777; margin-top: 2px;
    }

    /* ── Layer toggle ── */
    #layer-toggle {
      position: absolute; top: 12px; right: 12px; z-index: 999;
      background: rgba(255,255,255,.95); color:var(--ink); border: none; border-radius: 12px;
      padding: 10px 14px; font-size: 12.5px; font-weight: 700;
      box-shadow: 0 3px 12px rgba(0,0,0,.22); cursor: pointer;
      font-family: inherit; backdrop-filter: blur(4px);
    }
    #layer-toggle:active { transform: scale(.95); }

    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(8px);
      background: rgba(31,42,36,.96); color: white; padding: 12px 22px;
      border-radius: 24px; font-size: 13.5px; white-space: nowrap; font-weight:600;
      opacity: 0; transition: all .3s; pointer-events: none; z-index: 10000;
      box-shadow: 0 6px 24px rgba(0,0,0,.3);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Spinner overlay ── */
    #spinner {
      display: none; position: fixed; inset: 0;
      background: rgba(244,247,244,.82); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; flex-direction:column; gap:14px;
      z-index: 9998; font-size: 15px; color: var(--green-dk); font-weight:600;
    }
    #spinner::before{ content:""; width:42px; height:42px; border-radius:50%;
      border:4px solid #d7e6db; border-top-color:var(--green2); animation: spin .8s linear infinite; }
    @keyframes spin { to{ transform: rotate(360deg) } }
    #spinner.show { display: flex; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div>
    <h1>🌿 GEOai ตรวจสวนทุเรียน — อ.นายายอาม</h1>
    <small id="username-label">กำลังโหลด...</small>
  </div>
</div>

<!-- Tabs -->
<div id="tabs">
  <div class="tab active" data-tab="my-plots">📋 แปลงของฉัน</div>
  <div class="tab"        data-tab="new-plot">➕ เพิ่มแปลงใหม่</div>
</div>

<!-- ── Tab 1: My Plots ── -->
<div class="panel active" id="panel-my-plots">
  <div id="plot-list-wrap">
    <div id="no-plots">
      <span class="emoji">🌱</span>
      ยังไม่มีแปลงที่บันทึกไว้<br>
      กด "เพิ่มแปลงใหม่" เพื่อเริ่มต้น
    </div>
    <div id="plot-list"></div>
  </div>
</div>

<!-- ── Tab 2: New Plot ── -->
<div class="panel" id="panel-new-plot">
  <div style="position:relative;flex:1;min-height:0">
    <div id="map" style="width:100%;height:100%"></div>
    <button id="layer-toggle" title="สลับดาวเทียม/แผนที่">🛰️ ดาวเทียม</button>
  </div>
  <div id="new-plot-panel">
    <div id="coords-display">📍 จิ้มบนแผนที่ หรือวาดขอบเขตแปลง 🔷</div>
    <div class="input-row">
      <input id="plot-name-input"  type="text"   placeholder="ชื่อแปลง เช่น แปลงที่ 1" maxlength="50" />
      <input id="plot-area-input"  type="number" placeholder="ขนาด (ไร่)" min="0" max="9999" step="0.5" style="max-width:110px" />
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="gps-btn">📡 ตำแหน่งของฉัน</button>
      <button class="btn-draw" id="draw-btn">🔷 วาดขอบเขต</button>
      <button class="btn-primary"   id="submit-btn" disabled>🔍 ตรวจสอบแปลงนี้</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-grid" id="grid-btn" disabled>🌊 จุดน้ำขังในแปลง</button>
    </div>
    <div id="grid-legend">
      <span class="legend-item"><i style="background:#b71c1c"></i>แล้งวิกฤต</span>
      <span class="legend-item"><i style="background:#fdd835"></i>แห้งเกิน</span>
      <span class="legend-item"><i style="background:#06C755"></i>สมดุลดี</span>
      <span class="legend-item"><i style="background:#fb8c00"></i>ชื้นเกิน</span>
      <span class="legend-item"><i style="background:#e53935"></i>น้ำขังวิกฤต</span>
    </div>
  </div>
</div>

<!-- Toast + Spinner + History Modal -->
<div id="toast"></div>
<div id="spinner" class="show">⏳ กำลังโหลด...</div>
<div id="detail-modal">
  <div id="detail-box">
    <h3 id="modal-title">📊 ประวัติการวิเคราะห์</h3>
    <div id="modal-body"></div>
    <button class="close-modal-btn" id="close-modal-btn">✕ ปิด</button>
  </div>
</div>

<script src="config.js"></script>
<script>
  // Config from backend (injected via /liff/config.js) or fallback
  const _cfg      = window.GEOAI_CONFIG || {};
  const API_URL    = _cfg.API_URL || "";
  const LIFF_ID    = _cfg.LIFF_ID || "YOUR_LIFF_ID";
  const SPHERE_KEY = _cfg.SPHERE_KEY || "";

  // ─── State ────────────────────────────────────────
  let userId         = null;
  let displayName    = "";
  let selLat         = null;
  let selLng         = null;
  let pinMarker      = null;
  let map            = null;
  let userPlots      = [];
  let polygonCoords  = null;   // [[lng,lat], ...] or null
  let drawnPolygon   = null;   // sphere.Polygon overlay
  let isDrawing      = false;
  let drawPoints     = [];
  let drawDots       = [];
  let drawLine       = null;
  let plotOverlays   = [];
  let gridMarkers    = [];   // sphere.Dot[] — จุดตารางความชื้น/น้ำขัง

  // ─── Init ─────────────────────────────────────────
  liff.init({ liffId: LIFF_ID })
    .catch(() => {})   // ทำงานใน browser ปกติได้
    .finally(async () => {
      try { userId = liff.getContext()?.userId; } catch {}
      userId = userId || "test-user";

      const profile = await liff.getProfile().catch(() => null);
      if (profile) {
        displayName = profile.displayName || "";
      }
      document.getElementById("username-label").textContent =
        profile ? `สวัสดี ${profile.displayName}` : "";

      await loadUserPlots();
      initSphereMap();
      hideSpinner();
    });

  // ─── Tabs ─────────────────────────────────────────
  function switchTab(tabName) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.querySelector(`.tab[data-tab="${tabName}"]`)?.classList.add("active");
    document.getElementById("panel-" + tabName)?.classList.add("active");
    if (tabName === "new-plot" && map) {
      setTimeout(() => map.resize(), 50);
    }
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => switchTab(tab.dataset.tab));
  });

  // ─── Load user plots ──────────────────────────────
  async function loadUserPlots() {
    try {
      const res = await fetch(`${API_URL}/plots/${encodeURIComponent(userId)}`);
      const json = await res.json();
      userPlots = json.plots || [];
    } catch {
      userPlots = [];
    }
    renderPlotList();
  }

  function renderPlotList() {
    const list   = document.getElementById("plot-list");
    const noPlot = document.getElementById("no-plots");
    list.innerHTML = "";

    if (userPlots.length === 0) {
      noPlot.style.display = "block";
      return;
    }
    noPlot.style.display = "none";

    userPlots.forEach(plot => {
      const card = document.createElement("div");
      card.className = "plot-card";
      card.innerHTML = `
        <div class="plot-icon">🌳</div>
        <div class="plot-info">
          <div class="plot-name">${escHtml(plot.name || "แปลงที่ไม่มีชื่อ")}</div>
          <div class="plot-coords">📍 ${plot.lat.toFixed(4)}, ${plot.lng.toFixed(4)}</div>
          ${plot.area_rai ? `<div class="plot-area">📐 ${plot.area_rai} ไร่</div>` : ""}
        </div>
        <div class="plot-btn-col">
          <button class="plot-check-btn" data-lat="${plot.lat}" data-lng="${plot.lng}"
                  data-name="${escHtml(plot.name || "")}">
            🔍 ตรวจ
          </button>
          ${plot.id ? `<button class="plot-hist-btn" data-plot-id="${plot.id}"
                        data-plot-name="${escHtml(plot.name || "แปลง")}">
            📊 ประวัติ
          </button>` : ""}
          ${plot.id ? `<button class="plot-ts-btn" data-plot-id="${plot.id}"
                        data-plot-name="${escHtml(plot.name || "แปลง")}">
            📈 NDVI 2ปี
          </button>` : ""}
          ${plot.id ? `<button class="plot-del-btn" data-plot-id="${plot.id}"
                        data-plot-name="${escHtml(plot.name || "แปลง")}">
            🗑️ ลบ
          </button>` : ""}
        </div>
      `;
      card.querySelector(".plot-check-btn").addEventListener("click", e => {
        e.stopPropagation();
        const btn = e.currentTarget;
        submitAnalysis(
          parseFloat(btn.dataset.lat),
          parseFloat(btn.dataset.lng),
          btn.dataset.name,
          plot.area_rai || null,
          plot.polygon || null
        );
      });
      const histBtn = card.querySelector(".plot-hist-btn");
      if (histBtn) {
        histBtn.addEventListener("click", e => {
          e.stopPropagation();
          showHistory(
            parseInt(e.currentTarget.dataset.plotId),
            e.currentTarget.dataset.plotName
          );
        });
      }
      const tsBtn = card.querySelector(".plot-ts-btn");
      if (tsBtn) {
        tsBtn.addEventListener("click", e => {
          e.stopPropagation();
          showNDVITimeseries(
            parseInt(e.currentTarget.dataset.plotId),
            e.currentTarget.dataset.plotName
          );
        });
      }
      const delBtn = card.querySelector(".plot-del-btn");
      if (delBtn) {
        delBtn.addEventListener("click", e => {
          e.stopPropagation();
          const pid  = parseInt(e.currentTarget.dataset.plotId);
          const pnam = e.currentTarget.dataset.plotName;
          deletePlot(pid, pnam);
        });
      }
      list.appendChild(card);
    });
  }

  // ─── Sphere Map ───────────────────────────────────
  function initSphereMap() {
    function _boot() {
      map = new sphere.Map({
        placeholder: document.getElementById("map"),
        layer: sphere.Layers.HYBRID,
        zoom: 11,
        location: { lon: 101.70, lat: 12.97 },  // อ.นายายอาม จ.จันทบุรี
        language: "th"
      });
      map.Event.bind(sphere.EventName.Ready, () => {
        addPlotOverlays();
        map.Event.bind(sphere.EventName.Click, (e) => {
          if (isDrawing) {
            addDrawPoint(e.lon, e.lat);
          } else {
            setPin(e.lat, e.lon);
          }
        });
        // Layer toggle: HYBRID → STREETS → SIMPLE → cycle
        const LAYER_CYCLE = [
          { id: "hybrid",  label: "🛰️ ดาวเทียม" },
          { id: "streets", label: "🗺️ แผนที่" },
          { id: "simple",  label: "⚪ สะอาด" },
        ];
        let layerIdx = 0;
        document.getElementById("layer-toggle").addEventListener("click", () => {
          layerIdx = (layerIdx + 1) % LAYER_CYCLE.length;
          const lyr = LAYER_CYCLE[layerIdx];
          if (map.Layers && map.Layers.setBase) {
            map.Layers.setBase(lyr.id);
          }
          document.getElementById("layer-toggle").textContent = lyr.label;
        });
      });
    }

    if (!SPHERE_KEY) {
      // Dev mode: load Leaflet-backed mock
      const mock = document.createElement("script");
      mock.src = "/liff/sphere-mock.js";
      mock.onload = _boot;
      mock.onerror = () => { showToast("❌ โหลด sphere-mock.js ไม่สำเร็จ"); hideSpinner(); };
      document.head.appendChild(mock);
      return;
    }

    const script = document.createElement("script");
    script.src = `https://api.sphere.gistda.or.th/map/?key=${SPHERE_KEY}`;
    script.onload = _boot;
    script.onerror = () => {
      showToast("❌ โหลด Sphere Map ไม่สำเร็จ — ตรวจสอบ SPHERE_KEY");
      hideSpinner();
    };
    document.head.appendChild(script);
  }

  function addPlotOverlays() {
    plotOverlays.forEach(o => { try { map.Overlays.remove(o); } catch {} });
    plotOverlays = [];

    userPlots.forEach(p => {
      if (p.polygon && p.polygon.length >= 3) {
        const locs = p.polygon.map(c => ({ lon: c[0], lat: c[1] }));
        const poly = new sphere.Polygon(locs, {
          lineWidth: 2,
          lineColor: "rgba(26, 122, 60, 0.9)",
          fillColor: "rgba(26, 122, 60, 0.15)",
          label: p.name || "แปลง"
        });
        map.Overlays.add(poly);
        plotOverlays.push(poly);
      } else {
        const mk = new sphere.Marker(
          { lon: p.lng, lat: p.lat },
          { title: p.name || "แปลง", detail: `📐 ${p.area_rai || '-'} ไร่`, color: "#1a7a3c" }
        );
        map.Overlays.add(mk);
        plotOverlays.push(mk);
      }
    });
  }

  function setPin(lat, lon) {
    selLat = lat; selLng = lon;
    clearDrawing();

    document.getElementById("coords-display").innerHTML =
      `📍 <b>${lat.toFixed(5)}</b> , <b>${lon.toFixed(5)}</b>`;
    document.getElementById("submit-btn").disabled = false;

    if (pinMarker) { try { map.Overlays.remove(pinMarker); } catch {} }
    pinMarker = new sphere.Marker(
      { lon: lon, lat: lat },
      { title: "จุดที่เลือก", draggable: false, color: "#06C755" }
    );
    map.Overlays.add(pinMarker);
  }

  // ─── Polygon Drawing (click-based) ────────────────
  const drawBtn = document.getElementById("draw-btn");

  drawBtn.addEventListener("click", () => {
    if (isDrawing) { finishDrawing(); } else { startDrawing(); }
  });

  function startDrawing() {
    if (pinMarker) { try { map.Overlays.remove(pinMarker); } catch {} pinMarker = null; }
    clearDrawing();
    isDrawing = true;
    drawPoints = [];
    drawDots = [];
    drawLine = null;
    drawBtn.textContent = "✅ จบการวาด";
    drawBtn.classList.add("drawing");
    document.getElementById("coords-display").innerHTML =
      "🔷 จิ้มบนแผนที่เพื่อวาดจุดมุม แล้วกด <b>จบการวาด</b>";
    document.getElementById("submit-btn").disabled = true;
  }

  function addDrawPoint(lon, lat) {
    drawPoints.push({ lon, lat });
    const dot = new sphere.Dot({ lon, lat }, { lineWidth: 12, lineColor: "#06C755" });
    map.Overlays.add(dot);
    drawDots.push(dot);

    if (drawLine) { try { map.Overlays.remove(drawLine); } catch {} }
    if (drawPoints.length >= 2) {
      drawLine = new sphere.Polyline(drawPoints, {
        lineWidth: 3,
        lineColor: "rgba(6, 199, 85, 0.8)"
      });
      map.Overlays.add(drawLine);
    }

    document.getElementById("coords-display").innerHTML =
      `🔷 วาดแล้ว <b>${drawPoints.length}</b> จุด — จิ้มเพิ่มหรือกด <b>จบการวาด</b> (ต้อง ≥ 3)`;
  }

  function finishDrawing() {
    if (drawPoints.length < 3) { showToast("❌ ต้องวาดอย่างน้อย 3 จุด"); return; }
    isDrawing = false;
    drawBtn.textContent = "🔷 วาดขอบเขต";
    drawBtn.classList.remove("drawing");

    drawDots.forEach(d => { try { map.Overlays.remove(d); } catch {} });
    if (drawLine) { try { map.Overlays.remove(drawLine); } catch {} }
    drawDots = [];
    drawLine = null;

    polygonCoords = drawPoints.map(p => [p.lon, p.lat]);
    polygonCoords.push(polygonCoords[0]);

    drawnPolygon = new sphere.Polygon(drawPoints, {
      lineWidth: 3,
      lineColor: "rgba(6,199,85,1)",
      fillColor: "rgba(6,199,85,0.2)"
    });
    map.Overlays.add(drawnPolygon);

    const sumLat = drawPoints.reduce((s, p) => s + p.lat, 0);
    const sumLon = drawPoints.reduce((s, p) => s + p.lon, 0);
    selLat = sumLat / drawPoints.length;
    selLng = sumLon / drawPoints.length;

    document.getElementById("coords-display").innerHTML =
      `🔷 วาดขอบเขตแล้ว (${drawPoints.length} จุด) — ศูนย์กลาง <b>${selLat.toFixed(4)}</b>, <b>${selLng.toFixed(4)}</b>`;
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("grid-btn").disabled = false;
  }

  function clearDrawing() {
    if (drawnPolygon) { try { map.Overlays.remove(drawnPolygon); } catch {} }
    drawDots.forEach(d => { try { map.Overlays.remove(d); } catch {} });
    if (drawLine) { try { map.Overlays.remove(drawLine); } catch {} }
    drawnPolygon = null;
    polygonCoords = null;
    drawPoints = [];
    drawDots = [];
    drawLine = null;
    isDrawing = false;
    drawBtn.textContent = "🔷 วาดขอบเขต";
    drawBtn.classList.remove("drawing");
    document.getElementById("grid-btn").disabled = true;
    clearGridOverlay();
  }

  // ─── Moisture/waterlog grid overlay ────────────────
  const SWAB_COLORS = {
    waterlogged: "#e53935",
    wet:         "#fb8c00",
    optimal:     "#06C755",
    dry:         "#fdd835",
    drought:     "#b71c1c",
  };

  function clearGridOverlay() {
    gridMarkers.forEach(d => { try { map.Overlays.remove(d); } catch {} });
    gridMarkers = [];
    document.getElementById("grid-legend").classList.remove("show");
  }

  async function showMoistureGrid(polyOverride) {
    const poly = polyOverride || polygonCoords;
    if (!poly || poly.length < 3) {
      return showToast("❌ กรุณาวาดขอบเขตแปลงก่อน");
    }
    clearGridOverlay();
    showSpinner("⏳ กำลังวิเคราะห์จุดความชื้นในแปลง...");
    try {
      const res = await fetch(`${API_URL}/analyze/grid`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ polygon: poly, spacing_m: 10 }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.detail || "วิเคราะห์ไม่สำเร็จ");

      json.points.forEach(p => {
        const mk = new sphere.Marker(
          { lon: p.lng, lat: p.lat },
          {
            title: p.status_th || p.status,
            detail: `💧 น้ำในดิน ${p.soil_water_pct ?? '-'}%  |  📍 ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}` +
                    (p.advice ? `\n${p.advice}` : ""),
            color: SWAB_COLORS[p.status] || "#999",
            size: "small",
          }
        );
        map.Overlays.add(mk);
        gridMarkers.push(mk);
      });

      document.getElementById("grid-legend").classList.add("show");
      const waterlogged = json.points.filter(p => p.status === "waterlogged" || p.status === "drought").length;
      showToast(`🌊 พบ ${json.count} จุด — ${waterlogged} จุดเสี่ยง (น้ำขัง/แล้งวิกฤต)`);
    } catch (e) {
      showToast(`❌ ${e.message || "วิเคราะห์จุดน้ำขังไม่สำเร็จ"}`);
    } finally {
      hideSpinner();
    }
  }

  document.getElementById("grid-btn").addEventListener("click", showMoistureGrid);

  // ─── GPS button ───────────────────────────────────
  document.getElementById("gps-btn").addEventListener("click", () => {
    if (!navigator.geolocation) return showToast("เบราว์เซอร์ไม่รองรับ GPS");
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        setPin(lat, lon);
        map.location({ lon: lon, lat: lat }, true);
        map.zoom(15, true);
      },
      () => showToast("ไม่สามารถดึงตำแหน่งได้ กรุณาอนุญาต Location")
    );
  });

  // ─── Submit (new plot from map) ───────────────────
  document.getElementById("submit-btn").addEventListener("click", () => {
    if (!selLat || !selLng) return;
    const name = document.getElementById("plot-name-input").value.trim()
                 || `แปลงที่ ${userPlots.length + 1}`;
    const area = parseFloat(document.getElementById("plot-area-input").value) || null;
    submitAnalysis(selLat, selLng, name, area, polygonCoords);
  });

  // ─── Core submit ─────────────────────────────────
  async function submitAnalysis(lat, lng, plotName, areaRai, polyCoords) {
    showSpinner("⏳ กำลังวิเคราะห์ข้อมูลดาวเทียม...");
    try {
      const body = { lat, lng, user_id: userId, display_name: displayName, plot_name: plotName };
      if (areaRai) body.area_rai = areaRai;
      if (polyCoords) body.polygon = polyCoords;

      const res = await fetch(`${API_URL}/analyze`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(await res.text());
      const json = await res.json();

      if (liff.isInClient()) {
        await liff.sendMessages([{
          type: "text",
          text: `📍 ส่งพิกัดแปลง "${plotName}" เรียบร้อย\nกำลังวิเคราะห์ข้อมูลดาวเทียม รอผลใน LINE 🛰️`
        }]);
        // Show result briefly before closing
        showResult(json.data, plotName, polyCoords);
      } else {
        // Browser / dev mode — show full result
        showResult(json.data, plotName, polyCoords);
        await loadUserPlots();
        if (map) addPlotOverlays();
      }

      // มีขอบเขตแปลง → แสดงจุดน้ำขัง/ความชื้นบนแผนที่ทันที ไม่ต้องกดปุ่มซ้อน
      // ต้องสลับไปแท็บ "เพิ่มแปลงใหม่" ก่อน เพราะแผนที่อยู่ในแท็บนั้น — ถ้าผู้ใช้
      // กด "ตรวจ" จากแท็บ "แปลงของฉัน" แผนที่จะซ่อนอยู่ (สูง/กว้าง 0) มองไม่เห็นจุดที่ปัก
      if (map && polyCoords && polyCoords.length >= 3) {
        switchTab("new-plot");
        await new Promise(r => setTimeout(r, 150));   // รอ map.resize() ให้ layout นิ่งก่อน
        map.resize();
        const sumLat = polyCoords.reduce((s, c) => s + c[1], 0) / polyCoords.length;
        const sumLng = polyCoords.reduce((s, c) => s + c[0], 0) / polyCoords.length;
        map.location({ lon: sumLng, lat: sumLat }, true);
        map.zoom(18, true);
        await showMoistureGrid(polyCoords);
      }
    } catch (e) {
      showToast("❌ เกิดข้อผิดพลาด: " + e.message);
    } finally {
      hideSpinner();
    }
  }

  // ─── Delete plot ────────────────────────────────
  async function deletePlot(plotId, plotName) {
    if (!confirm(`ลบ "${plotName}" จริงหรือ?\nประวัติการตรวจจะไม่ถูกลบ`)) return;

    showSpinner("⏳ กำลังลบแปลง...");
    try {
      const res = await fetch(
        `${API_URL}/plots/${encodeURIComponent(userId)}/${plotId}`,
        { method: "DELETE" }
      );
      if (!res.ok) throw new Error(await res.text());
      showToast(`🗑️ ลบ "${plotName}" แล้ว`);
      await loadUserPlots();
      if (map) addPlotOverlays();
    } catch (e) {
      showToast("❌ ลบไม่สำเร็จ: " + e.message);
    } finally {
      hideSpinner();
    }
  }

  // ─── Plot History Modal ──────────────────────────
  async function showHistory(plotId, plotName) {
    document.getElementById("modal-title").textContent = `📊 ประวัติ — ${plotName}`;
    document.getElementById("modal-body").innerHTML = "<p style='color:#888;font-size:13px'>กำลังโหลด...</p>";
    document.getElementById("detail-modal").classList.add("show");

    try {
      const res = await fetch(
        `${API_URL}/plots/${encodeURIComponent(userId)}/${plotId}/history?limit=15`
      );
      if (!res.ok) throw new Error();
      const json = await res.json();
      const rows = json.history || [];

      if (rows.length === 0) {
        document.getElementById("modal-body").innerHTML =
          "<p style='color:#888;font-size:13px;text-align:center;padding:20px'>ยังไม่มีประวัติการตรวจ</p>";
        return;
      }

      // Sparkline (oldest → newest left→right)
      const sparkRows = [...rows].reverse();
      const vals = sparkRows.map(r => r.ndvi_now || 0);
      const svg  = buildSparkline(vals);

      document.getElementById("modal-body").innerHTML =
        `<div class="sparkline-wrap">
           <div class="sparkline-label">แนวโน้ม NDVI (${sparkRows.length} ครั้งล่าสุด)</div>
           ${svg}
         </div>` +
        rows.map(r => {
        const change  = ((r.ndvi_change || 0) * 100).toFixed(1);
        const isHigh  = r.ndvi_change < -0.20 || r.displacement_level === 'high';
        const isMed   = r.ndvi_change < -0.10 || r.displacement_level === 'medium';
        const cls     = isHigh ? "hist-red" : isMed ? "hist-orange" : "hist-green";
        const label   = isHigh ? "🔴 เสี่ยงสูง" : isMed ? "🟠 ปานกลาง" : "🟢 ปกติ";
        const arrow   = r.ndvi_change >= 0 ? "▲" : "▼";
        const date    = new Date(r.created_at).toLocaleString("th-TH",
                          { dateStyle: "short", timeStyle: "short" });
        // v2 fields
        const dispIcon = r.displacement_level === 'high' ? '⚠️' : r.displacement_level === 'medium' ? '🔶' : '✅';
        const stability = r.surface_stability != null ? Math.round(r.surface_stability * 100) : '-';
        const yieldKg = r.yield_estimated_kg != null ? r.yield_estimated_kg : '-';
        const fertLvl = r.fertilizer_level || '-';
        const fertLabel = { maintenance: '🟢 ปกติ', recovery: '🟠 ฟื้นฟู', intensive: '🔴 เข้มข้น', critical: '⚠️ วิกฤต' }[fertLvl] || fertLvl;

        return `<div class="hist-row">
          <div class="hist-date">📅 ${date}</div>
          <span class="hist-badge ${cls}">${label}</span>
          NDVI ${(r.ndvi_now || 0).toFixed(3)}
          &nbsp;<small style="color:#888">(${arrow}${Math.abs(+change)}%)</small>
          <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:11px;color:#666">
            <span>${dispIcon} ดิน ${stability}%</span>
            <span>📊 ผลผลิต ${yieldKg} กก./ไร่</span>
            <span>🧪 ปุ๋ย ${fertLabel}</span>
          </div>
        </div>`;
      }).join("");
    } catch {      document.getElementById("modal-body").innerHTML =
        "<p style='color:#e53935;font-size:13px'>ไม่สามารถโหลดประวัติได้</p>";
    }
  }

  // ─── SVG Sparkline ───────────────────────────────
  function buildSparkline(values) {
    if (values.length < 2) return "<svg class='sparkline-svg'></svg>";
    const W = 280, H = 60, PAD = 6;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 0.01;
    const step  = (W - PAD * 2) / (values.length - 1);

    const pts = values.map((v, i) => {
      const x = PAD + i * step;
      const y = PAD + (1 - (v - min) / range) * (H - PAD * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });

    const lastVal = values[values.length - 1];
    const lineColor = lastVal >= 0.5 ? "#1a7a3c"
                    : lastVal >= 0.3 ? "#fb8c00" : "#e53935";

    // Area fill path (close below)
    const areaPath = `M${pts[0]} L${pts.join(" L")} L${PAD + (values.length-1)*step},${H-PAD} L${PAD},${H-PAD} Z`;

    return `<svg class="sparkline-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <path d="${areaPath}" fill="${lineColor}" fill-opacity="0.12"/>
      <polyline points="${pts.join(" ")}"
        fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p, i) => {
        const [x, y] = p.split(",");
        return `<circle cx="${x}" cy="${y}" r="3" fill="${lineColor}" opacity="${i === values.length-1 ? 1 : 0.4}"/>`;
      }).join("")}
      <text x="${PAD}" y="${H}" font-size="9" fill="#aaa">เก่า</text>
      <text x="${W - PAD}" y="${H}" font-size="9" fill="#aaa" text-anchor="end">ล่าสุด</text>
    </svg>`;
  }

  document.getElementById("close-modal-btn").addEventListener("click", () => {    document.getElementById("detail-modal").classList.remove("show");
  });
  document.getElementById("detail-modal").addEventListener("click", e => {
    if (e.target === document.getElementById("detail-modal")) {
      document.getElementById("detail-modal").classList.remove("show");
    }
  });

  // ─── NDVI Timeseries Chart ───────────────────────
  let tsChart = null;

  async function showNDVITimeseries(plotId, plotName) {
    document.getElementById("modal-title").textContent = `📈 NDVI รายเดือน — ${plotName}`;
    document.getElementById("modal-body").innerHTML =
      `<p style="color:#888;font-size:13px">⏳ กำลังดึงข้อมูลจากดาวเทียม 2 ปี...</p>`;
    document.getElementById("detail-modal").classList.add("show");

    try {
      const res = await fetch(
        `${API_URL}/plots/${encodeURIComponent(userId)}/${plotId}/ndvi-timeseries?months=24`
      );
      if (!res.ok) throw new Error();
      const json = await res.json();
      const series = json.series || [];

      if (series.length < 2) {
        document.getElementById("modal-body").innerHTML =
          `<p style="color:#888;font-size:13px;text-align:center;padding:20px">ข้อมูลไม่เพียงพอสำหรับสร้างกราฟ</p>`;
        return;
      }

      document.getElementById("modal-body").innerHTML =
        `<canvas id="ts-chart" style="width:100%;height:220px;"></canvas>
         <div style="font-size:11px;color:#999;margin-top:8px;text-align:center">
           ข้อมูล Sentinel-2 รายเดือน ${series.length} เดือน | GEOai
         </div>`;

      if (tsChart) tsChart.destroy();
      const ctx = document.getElementById("ts-chart").getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, 200);
      grad.addColorStop(0, "rgba(26,122,60,0.3)");
      grad.addColorStop(1, "rgba(26,122,60,0.02)");

      tsChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: series.map(s => s.month),
          datasets: [{
            label: "NDVI",
            data: series.map(s => s.ndvi),
            borderColor: "#1a7a3c",
            backgroundColor: grad,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: "#1a7a3c",
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              label: ctx => `NDVI: ${ctx.parsed.y.toFixed(3)}`
            }}
          },
          scales: {
            x: {
              ticks: { font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 }
            },
            y: {
              min: 0, max: 1,
              title: { display: true, text: "NDVI", font: { size: 11 } },
              ticks: { font: { size: 10 } }
            }
          }
        }
      });
    } catch {
      document.getElementById("modal-body").innerHTML =
        `<p style="color:#e53935;font-size:13px">ไม่สามารถโหลดข้อมูล NDVI ได้</p>`;
    }
  }

  // ─── Helpers ─────────────────────────────────────
  function showToast(msg) {    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }
  function showSpinner(msg = "⏳ กำลังโหลด...") {
    const s = document.getElementById("spinner");
    s.textContent = msg; s.classList.add("show");
  }
  function hideSpinner() {
    document.getElementById("spinner").classList.remove("show");
  }
  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;");
  }

  // ─── Result Display (farmer-friendly) ──────────────
  function showResult(data, plotName, polyCoords) {
    const d = data;
    const disp = d.displacement || {};
    const fert = d.fertilizer || {};
    const yld  = d.yield_estimate || {};
    const imp  = d.land_impact || {};
    const swab = d.swab || {};
    const bsi  = d.bsi != null ? d.bsi : null;
    const topsoilRisk = d.topsoil_risk_level || 'low';

    // ── Overall status ──
    const isHigh = (d.ndvi_change < -0.20) || disp.change_level === "high" || imp.severity === "high" || topsoilRisk === "high" || swab.severity === "high";
    const isMed  = (d.ndvi_change < -0.10) || disp.change_level === "medium" || imp.severity === "medium" || topsoilRisk === "medium" || swab.severity === "medium";
    const statusIcon  = isHigh ? "🔴" : isMed ? "🟡" : "🟢";
    const statusText  = isHigh ? "ต้องดูแลเร่งด่วน" : isMed ? "ควรเฝ้าระวัง" : "สวนสมบูรณ์ดี";
    const statusColor = isHigh ? "#c62828" : isMed ? "#e65100" : "#1a7a3c";

    // ── NDVI → farmer language ──
    const ndviPct = Math.round(d.ndvi_now * 100);
    const ndviLabel = d.ndvi_now >= 0.65 ? "ใบเขียวสมบูรณ์ 🌿"
                    : d.ndvi_now >= 0.45 ? "เริ่มโทรม ใบไม่สมบูรณ์ 🍃"
                    : d.ndvi_now >= 0.30 ? "โทรมมาก ใบเหลืองร่วง 🍂"
                    : "วิกฤต! ต้นอาจตาย ⚠️";
    const ndviArrow = d.ndvi_change >= 0 ? "▲ ดีขึ้น" : "▼ แย่ลง";
    const ndviChangePct = Math.abs(d.ndvi_change * 100).toFixed(1);

    // ── Stability meter ──
    const stabPct = Math.round((disp.surface_stability || 0) * 100);
    const stabColor = stabPct >= 70 ? "#1a7a3c" : stabPct >= 40 ? "#fb8c00" : "#e53935";
    const stabLabel = stabPct >= 70 ? "ดินเสถียรดี ✅"
                    : stabPct >= 40 ? "ดินขยับบ้าง เฝ้าระวัง 🔶"
                    : "ดินไม่เสถียร! เสี่ยงทรุดตัว ⚠️";
    const dispClass = stabPct >= 70 ? "" : stabPct >= 40 ? "warn" : "danger";

    // ── Yield → farmer language ──
    const yieldKg = yld.estimated_kg_per_rai || 0;
    const yieldLabel = yld.quality === "high" ? "ผลผลิตดี 🎉"
                     : yld.quality === "medium" ? "ผลผลิตปานกลาง 📊"
                     : yld.quality === "low" ? "ผลผลิตต่ำ ⚠️"
                     : "ผลผลิตต่ำมาก 🚨";

    // ── Fertilizer → farmer language ──
    const fertLevelText = {
      maintenance: "🟢 บำรุงปกติ",
      recovery:    "🟠 ต้องฟื้นฟู",
      intensive:   "🔴 เข้มข้น (ต้นโทรม)",
      critical:    "⚠️ วิกฤต — ปรึกษาผู้เชี่ยวชาญ",
    }[fert.level] || fert.level;
    const fertClass = fert.level === "critical" ? "danger"
                    : fert.level === "intensive" ? "warn" : "";

    // ── Impact items ──
    const impacts = (imp.impacts || []).map(i =>
      `<div class="result-impact-item">
        <div class="imp-title">${i.icon} ${escHtml(i.title)}</div>
        ${escHtml(i.detail)}
      </div>`
    ).join("");
    const impClass = imp.severity === "high" ? "danger"
                   : imp.severity === "medium" ? "warn" : "";

    // ── Topsoil ──
    const topsoilBsiText = bsi != null ? bsi.toFixed(3) : '-';
    const topsoilRiskLabel = topsoilRisk === 'high'   ? '⚠️ ระวัง! หน้าดินเปิดโล่ง เสี่ยงปุ๋ยและหน้าดินถูกชะล้าง'
                           : topsoilRisk === 'medium' ? '🟠 หน้าดินเปิดบางส่วน ควรเฝ้าระวัง'
                           : '✅ หน้าดินสมบูรณ์ มีพืชคลุมดิน';
    const topsoilRiskColor = topsoilRisk === 'high' ? '#c62828' : topsoilRisk === 'medium' ? '#e65100' : '#1a7a3c';
    const topsoilClass = topsoilRisk === 'high' ? 'danger' : topsoilRisk === 'medium' ? 'warn' : '';

    const html = `
      <div class="result-header">
        <span class="result-icon">${statusIcon}</span>
        <div class="result-status" style="color:${statusColor}">${statusText}</div>
        <div class="result-coords">📍 ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)} — "${escHtml(plotName)}"</div>
      </div>

      ${polyCoords && polyCoords.length >= 3 ? `
      <div class="result-section" style="text-align:center;color:#1a7a3c;font-size:13px">
        🌊 ปักจุดน้ำขัง/ความชื้นบนแผนที่แล้ว — ปิดหน้าต่างนี้เพื่อดู แล้วแตะจุดสีเพื่อดูรายละเอียด
      </div>` : ''}

      <!-- สุขภาพต้นไม้ -->
      <div class="result-section">
        <div class="result-section-title">🌿 สุขภาพต้นทุเรียน</div>
        <div class="result-row">
          <span class="label">สภาพใบ</span>
          <span class="value">${ndviLabel}</span>
        </div>
        <div class="result-row">
          <span class="label">ค่า NDVI</span>
          <span class="value">${d.ndvi_now.toFixed(2)} (${ndviArrow} ${ndviChangePct}%)</span>
        </div>
        <div class="result-meter">
          <div class="result-meter-fill" style="width:${ndviPct}%;background:${d.ndvi_now >= 0.5 ? '#1a7a3c' : d.ndvi_now >= 0.3 ? '#fb8c00' : '#e53935'}"></div>
        </div>
      </div>

      <!-- เสถียรภาพดิน -->
      <div class="result-section ${dispClass}">
        <div class="result-section-title">🌍 เสถียรภาพดิน</div>
        <div class="result-row">
          <span class="label">สถานะ</span>
          <span class="value">${stabLabel}</span>
        </div>
        <div class="result-row">
          <span class="label">ความเสถียร</span>
          <span class="value">${stabPct}%</span>
        </div>
        <div class="result-meter">
          <div class="result-meter-fill" style="width:${stabPct}%;background:${stabColor}"></div>
        </div>
        <div class="result-row">
          <span class="label">ความชื้นดิน</span>
          <span class="value">${d.soil_moisture_vv > -10 ? '💧 ชื้นมาก' : d.soil_moisture_vv > -15 ? '💧 ปกติ' : '🏜️ แห้ง'} (${d.soil_moisture_vv} dB)</span>
        </div>
        <div class="result-row">
          <span class="label">ระดับพื้นที่</span>
          <span class="value">${d.elevation_diff < -1.5 ? '⬇️ ต่ำกว่ารอบข้าง' : d.elevation_diff > 1.0 ? '⬆️ สูงกว่ารอบข้าง' : '↔️ ระดับปกติ'} (${d.elevation_diff > 0 ? '+' : ''}${d.elevation_diff.toFixed(1)} ม.)</span>
        </div>
      </div>

      <!-- ความสมดุลน้ำ-อากาศในดิน (SWAB v3) -->
      ${swab.swab_index != null ? (() => {
        const swabIdx  = swab.swab_index;
        const waterPct = swab.soil_water_pct != null ? swab.soil_water_pct : 45;
        const airPct   = swab.soil_air_pct   != null ? swab.soil_air_pct   : 30;
        const solidPct = Math.max(0, 100 - waterPct - airPct);
        const ndwi     = swab.ndwi != null ? swab.ndwi : 0;
        const stTh     = swab.status_th || '—';
        const swabAdv  = swab.advice || '';
        const swabSev  = swab.severity || 'low';
        const swCls    = swabSev === 'high' ? 'danger' : swabSev === 'medium' ? 'warn' : '';
        const swCol    = swabSev === 'high' ? '#c62828' : swabSev === 'medium' ? '#e65100' : '#1565c0';
        const needleL  = ((swabIdx + 1) / 2 * 100).toFixed(1);
        const ndwiLbl  = ndwi >= 0.05 ? '💧 มีน้ำ' : ndwi >= -0.1 ? '🟰 ปกติ' : '🏜️ แห้ง';
        return `
        <div class="result-section ${swCls}">
          <div class="result-section-title">💧 ความสมดุลน้ำ-อากาศในดิน</div>
          <div class="result-row">
            <span class="label">สถานะ</span>
            <span class="value" style="color:${swCol};font-weight:bold">${escHtml(stTh)}</span>
          </div>
          <div class="result-row">
            <span class="label">MNDWI (ผิวน้ำ)</span>
            <span class="value">${ndwiLbl} (${ndwi >= 0 ? '+' : ''}${ndwi.toFixed(3)})</span>
          </div>
          <div class="swab-gauge-wrap">
            <div class="swab-gauge">
              <div class="swab-optimal"></div>
              <div class="swab-needle" style="left:${needleL}%"></div>
            </div>
            <div class="swab-gauge-labels">
              <span>💧 น้ำขัง</span><span>✅ สมดุล</span><span>🏜️ แล้ง</span>
            </div>
          </div>
          <div class="swab-pore-bar">
            <div class="swab-pore-water" style="width:${waterPct}%"></div>
            <div class="swab-pore-air"   style="width:${airPct}%"></div>
            <div class="swab-pore-solid" style="flex:1"></div>
          </div>
          <div class="swab-pore-labels">
            <span>🔵 น้ำ ${waterPct.toFixed(0)}%</span>
            <span>🩵 อากาศ ${airPct.toFixed(0)}%</span>
            <span>🟫 วัสดุดิน ~${solidPct.toFixed(0)}%</span>
          </div>
          <div class="result-advice">${escHtml(swabAdv)}</div>
        </div>`; })() : ''}

      <!-- สภาพหน้าดิน (Topsoil) -->
      <div class="result-section ${topsoilClass}">
        <div class="result-section-title">🌱 สภาพหน้าดิน (Topsoil)</div>
        <div class="result-row">
          <span class="label">ค่า BSI</span>
          <span class="value">${topsoilBsiText}</span>
        </div>
        <div class="result-row">
          <span class="label">สถานะ</span>
          <span class="value" style="color:${topsoilRiskColor};font-weight:bold">${topsoilRiskLabel}</span>
        </div>
        ${bsi != null ? `<div class="result-meter">
          <div class="result-meter-fill" style="width:${Math.min(100,Math.round(bsi/0.5*100))}%;background:${topsoilRiskColor}"></div>
        </div>` : ''}
      </div>

      <!-- ผลผลิตประเมิน -->
      <div class="result-section">
        <div class="result-section-title">📊 ประเมินผลผลิต</div>
        ${d.predicted_yield_kg_per_rai != null ? `
        <div class="result-row">
          <span class="label">🤖 AI พยากรณ์</span>
          <span class="value" style="font-size:15px;font-weight:bold;color:${d.predicted_yield_kg_per_rai >= 1200 ? '#1a7a3c' : d.predicted_yield_kg_per_rai >= 800 ? '#e65100' : '#c62828'}">${d.predicted_yield_kg_per_rai.toLocaleString()} กก./ไร่</span>
        </div>` : ''}
        <div class="result-row">
          <span class="label">ผลผลิตคาดการณ์</span>
          <span class="value" style="font-size:15px;color:${yld.quality === 'high' ? '#1a7a3c' : yld.quality === 'medium' ? '#e65100' : '#c62828'}">${yieldKg.toLocaleString()} กก./ไร่/ปี</span>
        </div>
        <div class="result-row">
          <span class="label">ช่วงประเมิน</span>
          <span class="value">${(yld.range_low||0).toLocaleString()} – ${(yld.range_high||0).toLocaleString()} กก.</span>
        </div>
        <div class="result-row">
          <span class="label">ระดับ</span>
          <span class="value">${yieldLabel}</span>
        </div>
      </div>

      <!-- คำแนะนำปุ๋ย -->
      <div class="result-section ${fertClass}">
        <div class="result-section-title">🧪 คำแนะนำปุ๋ย (กก./ต้น/ปี)</div>
        <div class="result-row">
          <span class="label">ระดับ</span>
          <span class="value">${fertLevelText}</span>
        </div>
        <div class="result-row">
          <span class="label">ไนโตรเจน (N)</span>
          <span class="value">${fert.n_kg_per_tree} กก.</span>
        </div>
        <div class="result-row">
          <span class="label">ฟอสฟอรัส (P)</span>
          <span class="value">${fert.p_kg_per_tree} กก.</span>
        </div>
        <div class="result-row">
          <span class="label">โพแทสเซียม (K)</span>
          <span class="value">${fert.k_kg_per_tree} กก.</span>
        </div>
        ${fert.ca_kg_per_tree > 0 ? `<div class="result-row"><span class="label">แคลเซียม (Ca)</span><span class="value">${fert.ca_kg_per_tree} กก.</span></div>` : ''}
        ${fert.mg_kg_per_tree > 0 ? `<div class="result-row"><span class="label">แมกนีเซียม (Mg)</span><span class="value">${fert.mg_kg_per_tree} กก.</span></div>` : ''}
        <div class="result-advice">${escHtml(fert.note || '')}</div>
      </div>

      <!-- ผลกระทบ -->
      ${impacts ? `<div class="result-section ${impClass}">
        <div class="result-section-title">🛡️ การประเมินผลกระทบ ${imp.severity === 'high' ? '(เสี่ยงสูง!)' : imp.severity === 'medium' ? '(ปานกลาง)' : '(ปกติ)'}</div>
        ${impacts}
      </div>` : ''}
    `;

    document.getElementById("modal-title").textContent = `🛰️ ผลวิเคราะห์แปลง "${plotName}"`;
    document.getElementById("modal-body").innerHTML = html;
    document.getElementById("detail-modal").classList.add("show");
  }
</script>
</body>
</html>
