name: CI — tests

# เดิม workflow นี้ทริกเกอร์บน branch "main" ซึ่งไม่มีอยู่ (repo ใช้ "master") จึงไม่เคยรัน
# และมี job deploy ไป Railway ที่ไม่ได้ใช้แล้ว — production อยู่บน Render ซึ่ง auto-deploy
# จาก master เอง ไฟล์นี้จึงเหลือแค่รัน test (ดู docs/v2/phase0-report.md หัวข้อ 5)
#
# env ปลอมทั้งหมดอยู่ใน backend/conftest.py — ไม่ต้องตั้ง secret ใดๆ ที่นี่

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short
