name: Trigger daily scan and rain alert jobs

# v2 (แก้จากรุ่นแรกที่ล้มเหลว): รุ่นแรกยิง GET /health ทุก 5 นาทีคร่อมช่วง
# 05:45–07:20 น. ไทย หวังให้เซิร์ฟเวอร์ตื่นอยู่พอดีตอน APScheduler ในโปรเซสยิง
# cron เอง — ตรวจสอบย้อนหลังพบว่า GitHub Actions "ทิ้ง" ตารางเวลาความถี่สูง
# (ทุก 5 นาที) ไปเกือบหมด (ยิงจริงแค่ 6 จาก ~20 ครั้งที่ตั้งไว้ ในคืนแรกที่ใช้งาน)
# ทำให้มีช่องว่างคร่อมเวลา 07:00 น. พอดี — เซิร์ฟเวอร์หลับอยู่ตอน cron ยิง แล้ว
# ไม่มีทาง "ตามทำงานย้อนหลัง" ได้เลย เพราะ APScheduler ใช้ MemoryJobStore สร้าง
# ใหม่ทุกครั้งที่โปรเซสเริ่ม (ตื่นจาก sleep = โปรเซสใหม่ = คำนวณรอบถัดไปเป็น
# "พรุ่งนี้" ทันที ไม่ misfire ย้อนหลัง) — digest/แจ้งเตือนเลยไม่เคยทำงานจริงเลย
# แม้จะมี keep-alive แล้วก็ตาม
#
# รุ่นนี้: เลิกพึ่ง "ปลุกเซิร์ฟเวอร์ให้ทันเวลาพอดี" เปลี่ยนมายิง POST ตรงไปยัง
# /admin/trigger/rain-alert (06:00 น.) และ /admin/trigger/daily-scan (07:00 น.)
# ที่มีอยู่แล้วในระบบ (ออกแบบมาสำหรับ external cron แบบนี้โดยเฉพาะ) — request
# นี้เองจะปลุกเซิร์ฟเวอร์ขึ้นมาก่อน (Render ตื่นเมื่อมี HTTP request เข้า) แล้วค่อย
# สั่งรันงานจริงทันทีที่ตื่น ไม่ต้องพึ่งความแม่นยำของเวลาปลุกอีกต่อไป — ต่อให้
# GitHub Actions หน่วง/เลื่อนไปสักกี่นาที งานก็ยังรันจริง แค่ช้าลงเล็กน้อย ไม่ใช่
# ไม่รันเลยแบบเดิม
#
# หมายเหตุ: ปิด cron ในโปรเซส (backend/scheduler.py) สำหรับ 2 งานนี้ไปแล้ว กัน
# รันซ้ำสองครั้ง (ถ้าบังเอิญเซิร์ฟเวอร์ตื่นอยู่พอดีตอน 06:00/07:00 จาก traffic
# อื่นด้วย) — endpoint เหล่านี้คือแหล่งความจริงหนึ่งเดียวของ 2 งานนี้แล้ว
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * *'  # 06:00 น. ไทย — rain_alert_job (ฝน/รากเน่า)
    - cron: '0 0 * * *'   # 07:00 น. ไทย — daily_scan_job (ความเสี่ยง + สรุปประจำวัน)

jobs:
  rain-alert:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rain-alert job
        run: |
          curl -sf -X POST --max-time 60 \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            https://iamroot.onrender.com/admin/trigger/rain-alert \
            && echo "OK — rain-alert job started" \
            || echo "trigger failed (server may still be waking up — check /admin/logs)"

  daily-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-scan job (includes daily digest)
        run: |
          curl -sf -X POST --max-time 60 \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            https://iamroot.onrender.com/admin/trigger/daily-scan \
            && echo "OK — daily-scan job started" \
            || echo "trigger failed (server may still be waking up — check /admin/logs)"
