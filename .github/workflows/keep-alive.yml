name: Trigger daily scan and rain alert jobs

# v2 (แก้จากรุ่นแรกที่ล้มเหลว): รุ่นแรกยิง GET /health ทุก 5 นาทีคร่อมช่วง
# 05:45–07:20 น. ไทย หวังให้เซิร์ฟเวอร์ตื่นอยู่พอดีตอน APScheduler ในโปรเซสยิง
# cron เอง — ตรวจสอบย้อนหลังพบว่า GitHub Actions "ทิ้ง" ตารางเวลาความถี่สูง
# (ทุก 5 นาที) ไปเกือบหมด (ยิงจริงแค่ 6 จาก ~20 ครั้งที่ตั้งไว้ ในคืนแรกที่ใช้งาน)
# ทำให้มีช่องว่างคร่อมเวลา 07:00 น. พอดี — เซิร์ฟเวอร์หลับอยู่ตอน cron ยิง แล้ว
# ไม่มีทาง "ตามทำงานย้อนหลัง" ได้เลย เพราะ APScheduler ใช้ MemoryJobStore สร้าง
# ใหม่ทุกครั้งที่โปรเซสเริ่ม (ตื่นจาก sleep = โปรเซสใหม่ = คำนวณรอบถัดไปเป็น
# "พรุ่งนี้" ทันที ไม่ misfire ย้อนหลัง) — digest/แจ้งเตือนเลยไม่เคยทำงานจริงเลย
# แม้จะมี keep-alive แล้วก็ตาม
#
# v3: เลิกพึ่ง "ปลุกเซิร์ฟเวอร์ให้ทันเวลาพอดี" เปลี่ยนมายิง POST ตรงไปยัง
# /admin/trigger/rain-alert และ /admin/trigger/daily-scan ที่มีอยู่แล้วในระบบ
# (ออกแบบมาสำหรับ external cron แบบนี้โดยเฉพาะ) — request นี้เองจะปลุกเซิร์ฟเวอร์
# ขึ้นมาก่อน (Render ตื่นเมื่อมี HTTP request เข้า) แล้วค่อยสั่งรันงานจริงทันทีที่ตื่น
# ไม่ต้องพึ่งความแม่นยำของเวลาปลุกอีกต่อไป — ต่อให้ GitHub Actions หน่วง/เลื่อนไปสัก
# กี่นาที งานก็ยังรันจริง แค่ช้าลงเล็กน้อย ไม่ใช่ไม่รันเลยแบบเดิม
#
# v4 (ตามที่ผู้ใช้ขอ "ตั้งเวลาแจ้งเตือนเองได้"): เดิมทริกเกอร์ 2 ครั้งตายตัว/วัน
# (05:30 rain-alert, 06:00 daily-scan) ประมวลผลทุกคนพร้อมกัน — ตอนนี้ผู้ใช้แต่ละคน
# เลือกเวลาแจ้งเตือนเองได้ (05:00-10:00 น., ดู migrate_v8.sql +
# backend/webhook.py _time_picker_menu) เปลี่ยนมาทริกเกอร์ทุกชั่วโมงในช่วงที่เปิดให้
# เลือก คำนวณชั่วโมงปัจจุบัน (เวลาไทย) แล้วส่งเป็น ?hour= ให้ทั้งสอง endpoint —
# ฝั่ง backend (daily_scan_job/rain_alert_job) จะกรองเหลือเฉพาะผู้ใช้ที่ตั้ง
# notify_hour ตรงกับชั่วโมงนั้นเท่านั้น คนอื่นไม่ถูกแตะเลยในรอบนั้น (กันสแกน/ส่งซ้ำ
# 6 รอบ/วันให้ทุกคน)
#
# หมายเหตุ: ปิด cron ในโปรเซส (backend/scheduler.py) สำหรับ 2 งานนี้ไปแล้ว กัน
# รันซ้ำสองครั้ง (ถ้าบังเอิญเซิร์ฟเวอร์ตื่นอยู่พอดีตอนใดตอนหนึ่งจาก traffic อื่นด้วย)
# — endpoint เหล่านี้คือแหล่งความจริงหนึ่งเดียวของ 2 งานนี้แล้ว
# v5 (ตรวจสอบย้อนหลังพบจริง 21-22 ส.ค. 2569: รอบ 07:00 น. หายไปทั้งรอบวันที่ 22,
# วันที่ 21 รันได้แค่ 2 จาก 6 รอบที่ตั้งไว้): GitHub เขียนไว้เองว่า scheduled
# workflow อาจถูก "ทิ้ง" ได้ถ้าโหลดสูง โดยเฉพาะ "ต้นชั่วโมงพอดี" (นาทีที่ 00) ซึ่ง
# เป็นช่วงคับคั่งที่สุดเพราะ cron ทั่วโลกตั้งเวลาชนกันที่นาทีนี้เยอะสุด — เลื่อนออก
# จากนาที 00 มาที่นาที 07 แทน หลีกเลี่ยงช่วงคับคั่งสุด (ยังมีการ "ตามงานย้อนหลัง"
# กันไว้อีกชั้นที่ฝั่ง backend ด้วย — ดู scheduler.py::run_job_with_catchup — เผื่อ
# GitHub ยังทิ้งรอบอยู่ดีแม้เลื่อนนาทีแล้ว)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 22 * * *'  # 05:00 น. ไทย
    - cron: '7 23 * * *'  # 06:00 น. ไทย
    - cron: '7 0 * * *'   # 07:00 น. ไทย
    - cron: '7 1 * * *'   # 08:00 น. ไทย
    - cron: '7 2 * * *'   # 09:00 น. ไทย
    - cron: '7 3 * * *'   # 10:00 น. ไทย

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Compute current Bangkok hour
        id: hour
        run: echo "h=$(TZ=Asia/Bangkok date +%H)" >> "$GITHUB_OUTPUT"

      - name: Trigger rain-alert job for this hour
        run: |
          curl -sf -X POST --max-time 60 \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            "https://iamroot.onrender.com/admin/trigger/rain-alert?hour=${{ steps.hour.outputs.h }}" \
            && echo "OK — rain-alert job started (hour=${{ steps.hour.outputs.h }})" \
            || echo "trigger failed (server may still be waking up — check /admin/logs)"

      - name: Trigger daily-scan job for this hour (includes daily digest)
        run: |
          curl -sf -X POST --max-time 60 \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            "https://iamroot.onrender.com/admin/trigger/daily-scan?hour=${{ steps.hour.outputs.h }}" \
            && echo "OK — daily-scan job started (hour=${{ steps.hour.outputs.h }})" \
            || echo "trigger failed (server may still be waking up — check /admin/logs)"
